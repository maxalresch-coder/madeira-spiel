<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b5f78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Operação Madeira">
  <meta name="application-name" content="Operação Madeira">
  <link rel="manifest" href="manifest.json">
  <title>Operação Madeira - Das Spiel</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login -->
  <section id="login" class="login" hidden>
    <div class="login-box">
      <div class="login-logo" aria-hidden="true" data-icon="flower-2"></div>
      <h1>Operação Madeira</h1>
      <p class="login-sub">Das Spiel</p>
      <p class="muted">Drei Entdecker, zehn Regionen, eine Insel.</p>
      <form id="login-form" autocomplete="on">
        <label>Dein Name
          <input id="login-name" name="name" required maxlength="24" autocomplete="nickname" placeholder="z. B. Maxi">
        </label>
        <label>Passwort
          <input id="login-pass" name="password" type="password" required autocomplete="current-password">
        </label>
        <button class="btn btn-primary btn-block" type="submit">Los geht's</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-row">
      <div class="brand" id="brand-logo" aria-label="Operação Madeira">
        <span class="logo"><span class="logo-ic" aria-hidden="true" data-icon="compass"></span><span class="logo-txt">Operação Madeira</span></span>
      </div>
      <nav class="hdr-nav" aria-label="Bereiche">
        <button class="hdr-btn" data-go="shop" aria-label="Shop" title="Shop"><span class="hdr-ic" aria-hidden="true" data-icon="shopping-bag"></span><span class="hdr-lbl">Shop</span></button>
        <button class="hdr-btn" data-go="stats" aria-label="Erfolge" title="Erfolge: Rang, Regionen, Punkte"><span class="hdr-ic" aria-hidden="true" data-icon="trophy"></span><span class="hdr-lbl">Erfolge</span></button>
        <button class="hdr-btn hdr-wide" data-go="log" aria-label="Aktivitäten" title="Aktivitäten: alles, was passiert ist"><span class="hdr-ic" aria-hidden="true" data-icon="history"></span><span class="hdr-lbl">Aktivitäten</span></button>
        <button class="hdr-btn hdr-set" data-go="settings" aria-label="Einstellungen" title="Einstellungen: Spielanleitung, Spieler, Sichern, Urlaub beenden, Reset"><span class="hdr-ic" aria-hidden="true" data-icon="settings"></span><span class="hdr-lbl">Einstellungen</span></button>
      </nav>
      </div>
      <button class="rank-badge" data-go="stats" aria-label="Teamrang und Kontostand – zu den Erfolgen">
        <span class="rb-fig" id="rb-fig" aria-hidden="true"></span><span id="hdr-rank"></span><span class="rb-sep" aria-hidden="true">·</span><span id="hdr-points" class="hdr-points"></span>
      </button>
      <div id="offline" class="offline" role="status" hidden><span data-icon="wifi-off"></span> Offline – Änderungen werden nicht gespeichert</div>
    </header>
    <main id="view" class="view"></main>
    <input type="file" id="restore-file" accept=".json,application/json" hidden>
  </div>

  <div id="modal-root"></div>
  <div id="fx-root" aria-hidden="true"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="content.js"></script>
  <script src="map-data.js"></script>
  <script src="logic.js"></script>
  <script src="tools.js"></script>
  <script src="bay-map.js"></script>
  <script src="icons.js"></script>
  <script src="figures.js"></script>
  <script src="vendor/jspdf.umd.min.js" defer></script>
  <script src="app.js"></script>
</body>
</html>
